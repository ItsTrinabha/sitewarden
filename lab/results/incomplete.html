.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

ns SAMEORIGIN\nHeader always append Content-Security-Policy \"frame-ancestors 'self'\"", "caddy": "header X-Frame-Options SAMEORIGIN", "express": "app.use(helmet.frameguard({ action: 'sameorigin' }));"}, "refs": [], "cap": null, "tags": ["CWE-1021", "OWASP A04:2021"]}, {"id": "hsts.missing", "category": "headers", "severity": "medium", "title": "HTTP Strict Transport Security (HSTS) not enabled", "detail": "Without HSTS a network attacker can strip HTTPS (sslstrip) whenever a user follows an http:// link or types the bare domain, and users can click through certificate warnings.", "evidence": null, "fix": "Send Strict-Transport-Security with max-age of at least one year.", "snippets": {"nginx": "add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;", "apache": "Header always set Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\"", "caddy": "header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\"", "express": "app.use(helmet.hsts({ maxAge: 63072000, includeSubDomains: true, preload: true }));", "cloudflare": "SSL/TLS -> Edge Certificates -> HTTP Strict Transport Security (HSTS): enable, max-age 12 months, include subdomains, preload"}, "refs": ["https://www.rfc-editor.org/rfc/rfc6797"], "cap": null, "tags": ["CWE-319", "CWE-523"]}, {"id": "content.generator", "category": "content", "severity": "low", "title": "CMS version disclosed: WordPress 4.9.8", "detail": "The generator tag tells attackers exactly which CMS release (and known bugs) to target.", "evidence": null, "fix": "Remove the generator meta tag.", "snippets": {}, "refs": [], "cap": null, "tags": ["CWE-200"]}, {"id": "content.mixed_passive", "category": "content", "severity": "low", "title": "Passive mixed content: 1 media URL(s) over HTTP", "detail": "Images and media over HTTP can be swapped or used to track users; browsers now auto-upgrade or block them.", "evidence": "http://legacy.lab.test:10080/logo.png", "fix": n   function compRow(name, c) {
    if (!c) return null;
    return h("div", { class: "comp" }, h("div", { class: "mark " + (c.compliant ? "yes" : "bad") }, c.compliant ? "✔" : "✘"),
      h("div", {}, h("b", {}, c.name || name), c.compliant ? h("div", { class: "note" }, "Meets the requirements Sitewarden can observe externally.")
        : h("ul", {}, (c.problems || []).map((p) => h("li", {}, p)))));
  }
  function tabCompliance() {
    const comp = report.compliance || {};
    return h("div", { class: "panel" }, h("h2", {}, "Standards"),
      Object.entries(comp).map(([k, v]) => compRow(k, v)),
      h("p", { class: "note" }, "External checks can show non-compliance but cannot prove compliance: these standards also cover things only visible from inside your systems."));
  }

  // ------------------------------------------------------------------ tab: share
  function tabShare() {
    if (STANDALONE) return h("div", { class: "empty" }, "Open the hosted report to get a badge.");
    const badge = `${location.origin}/badge/${report.target}.svg`;
    const page2 = `${location.origin}/scan/${report.id}`;
    const md = `[![Sitewarden grade](${badge})](${page2})`;
    const line = (label, value) => h("div", { style: "margin-top:12px" }, h("div", { class: "note" }, label),
      h("div", { class: "copyline" }, h("input", { readonly: true, value }), h("button", { class: "btn small ghost", type: "button", onclick: () => copy(value) }, "Copy")));
    return h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h2", {}, "Grade badge"), h("img", { src: `/badge/${report.target}.svg`, alt: "Sitewarden grade badge", height: 20 }),
        line("Markdown", md), line("Image URL", badge), line("Report link", page2)),
      h("div", { class: "panel" }, h("h2", {}, "API & CLI"),
        h("p", { class: "note" }, "Start a scan and poll it:"),
        h("pre", { class: "evidence" }, `curl -s -X POST ${location.origin}/api/scans \\\n  -H 'Content-Type: application/json' \\\n  -d '{"target":"${report.target}"}'\n\ncurl -s ${location.origin}/api/scans/<id>`),
        h("p", { class: "note" }, "Or run it locally and fail CI below a grade:"),
        h("pre", { class: "evidence" }, `pip install sitewarden\nsitewarden scan ${report.target} --fail-under B`)));
  }

  const TABS = { findings: tabFindings, tls: tabTLS, cert: tabCert, http: tabHTTP, content: tabContent, dns: tabDNS, email: tabEmail, compliance: tabCompliance, share: tabShare };

  // ------------------------------------------------------------------ router
  function route() {
    document.body.classList.remove("on-scan");
    if (STANDALONE) {
      const data = JSON.parse(document.getElementById("report-data").textContent);
      renderReport(data, {});
      return;
    }
    const m = location.pathname.match(/^\/scan\/([A-Za-z0-9_-]{8,40})\/?$/);
    if (m) { scanView(m[1]); return; }
    const q = new URLSearchParams(location.search).get("url");
    home(q || "");
  }
  window.addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
